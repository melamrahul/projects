<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housie — Your Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115; --surface:#161a20; --surface-2:#1e242c; --surface-3:#262e38;
  --border:#2a323d; --text:#e8eaed; --text-dim:#9aa0a6; --text-muted:#5f6368;
  --primary:#8ab4f8; --accent:#fbbc04; --success:#81c995; --danger:#f28b82;
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --shadow-2:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
  --shadow-3:0 4px 8px rgba(0,0,0,.3),0 8px 24px 4px rgba(0,0,0,.15);
  --radius-s:8px; --radius-m:12px; --radius-l:16px; --radius-xl:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Roboto','Google Sans',system-ui,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* App bar */
.app-bar{
  height:64px; padding:0 24px; display:flex; align-items:center; gap:16px;
  background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
}
.app-bar .logo{
  width:36px; height:36px; border-radius:50%;
  background:linear-gradient(135deg,#8ab4f8,#fbbc04);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:700; color:#202124;
}
.app-bar h1{font-family:'Google Sans';font-size:20px;font-weight:500}
.app-bar .spacer{flex:1}
.user-chip{
  display:flex; align-items:center; gap:8px;
  background:var(--surface-2); padding:6px 14px 6px 6px; border-radius:100px;
  border:1px solid var(--border); font-size:14px;
}
.user-chip .avatar{
  width:28px; height:28px; border-radius:50%;
  background:linear-gradient(135deg,#8ab4f8,#fbbc04);
  display:flex; align-items:center; justify-content:center;
  font-weight:600; color:#202124; font-size:13px;
}
.user-chip .name{font-weight:500; color:var(--text)}

/* Status strip */
.status-strip{
  padding:10px 24px; display:flex; align-items:center; gap:8px;
  background:var(--surface-2); border-bottom:1px solid var(--border);
  font-size:13px; color:var(--text-dim);
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted)}
.status-dot.live{background:var(--success); animation:pulse 1.6s infinite}
.status-dot.stopped{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Main layout */
main{
  max-width:1280px; margin:0 auto; padding:24px;
  display:grid; grid-template-columns:1fr 380px; gap:24px;
}
@media(max-width:1000px){ main{grid-template-columns:1fr} }

/* Card base */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-l); box-shadow:var(--shadow-1);
}

/* Rotator card */
.rotator-card{padding:28px; margin-bottom:24px; display:flex; flex-direction:column; align-items:center}
.rotator-label{font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:16px}
.rotator-number{
  width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #2d3541, #1a1f26);
  display:flex; align-items:center; justify-content:center;
  font-family:'Google Sans'; font-size:88px; font-weight:700;
  color:var(--accent); border:3px solid var(--surface-3);
  box-shadow:inset 0 0 40px rgba(251,188,4,.08), var(--shadow-2);
  transition:transform .3s ease;
}
.rotator-number.spin{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85);opacity:.6}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.rotator-meta{
  margin-top:16px; display:flex; gap:24px; font-size:13px; color:var(--text-dim);
}
.rotator-meta strong{color:var(--text); font-weight:500}

/* Grid card */
.grid-card{padding:24px}
.card-title{
  font-family:'Google Sans'; font-size:16px; font-weight:500;
  color:var(--text); margin-bottom:16px; display:flex; align-items:center; gap:8px;
}
.card-title .badge{
  background:var(--surface-3); color:var(--text-dim);
  font-size:11px; padding:2px 8px; border-radius:100px; font-weight:500;
}
.grid-90{
  display:grid; grid-template-columns:repeat(10, 1fr); gap:6px;
}
.num-cell{
  aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border-radius:var(--radius-s);
  font-size:13px; font-weight:500; color:var(--text-dim);
  transition:all .2s; border:1px solid transparent;
}
.num-cell.called{
  background:rgba(138,180,248,.12); color:var(--primary);
  border-color:rgba(138,180,248,.25);
}
.num-cell.last-called{
  background:var(--accent); color:#202124; font-weight:700;
  box-shadow:0 0 16px rgba(251,188,4,.4);
  transform:scale(1.08); z-index:2;
}

/* Sidebar */
.sidebar{display:flex; flex-direction:column; gap:16px}

/* Ticket card */
.ticket-card{padding:20px}
.ticket-header{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:14px;
}
.ticket-header h3{font-family:'Google Sans';font-size:15px;font-weight:500}
.ticket-header .count{
  font-size:13px; color:var(--text-dim);
}
.ticket-header .count strong{color:var(--accent); font-weight:500}
.ticket-grid{
  display:grid; grid-template-columns:repeat(9, 1fr); gap:4px;
  background:var(--surface-2); padding:8px; border-radius:var(--radius-m);
}
.ticket-cell{
  aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  background:var(--surface); border-radius:6px;
  font-size:13px; font-weight:500; color:var(--text-dim);
  cursor:pointer; transition:all .2s; user-select:none;
  border:1px solid var(--border);
}
.ticket-cell.empty{background:transparent; border-color:transparent; cursor:default}
.ticket-cell.marked{
  background:var(--accent); color:#202124; font-weight:700;
  border-color:var(--accent); box-shadow:0 0 8px rgba(251,188,4,.35);
}
.ticket-cell.called-now{
  border-color:var(--primary); color:var(--primary);
  animation:glow 1.6s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 rgba(138,180,248,0)}
  50%{box-shadow:0 0 12px rgba(138,180,248,.5)}
}

/* Progress card */
.progress-card{padding:20px}
.progress-track{
  height:6px; background:var(--surface-3); border-radius:100px;
  overflow:hidden; margin-top:10px;
}
.progress-fill{
  height:100%; background:linear-gradient(90deg,#8ab4f8,#fbbc04);
  border-radius:100px; transition:width .4s ease;
}
.progress-row{display:flex; justify-content:space-between; font-size:13px; color:var(--text-dim)}

/* Status msg */
.status-msg{
  padding:14px 16px; border-radius:var(--radius-m);
  background:var(--surface-2); border:1px solid var(--border);
  font-size:13px; color:var(--text-dim); line-height:1.5;
  display:flex; align-items:center; gap:10px;
}
.status-msg.win{
  background:rgba(129,201,149,.1); border-color:rgba(129,201,149,.3);
  color:var(--success);
}
.status-msg.info{
  background:rgba(138,180,248,.08); border-color:rgba(138,180,248,.25);
  color:var(--primary);
}
.status-msg .icon{font-size:16px}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
  padding:20px; z-index:100; animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-xl); padding:40px 32px;
  max-width:440px; width:100%; box-shadow:var(--shadow-3);
  animation:slideUp .35s ease;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h2{font-family:'Google Sans';font-size:24px;font-weight:400;margin-bottom:8px}
.modal p{color:var(--text-dim);font-size:14px;margin-bottom:24px;line-height:1.5}
.modal input{
  width:100%; padding:14px 18px; border-radius:var(--radius-m);
  border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-size:15px; outline:none; transition:border .2s;
  font-family:'Roboto';
}
.modal input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(138,180,248,.15)}
.modal .btn{
  width:100%; margin-top:16px; padding:14px; border-radius:100px;
  border:none; background:var(--primary); color:#202124;
  font-family:'Google Sans'; font-size:15px; font-weight:500;
  cursor:pointer; transition:all .2s;
}
.modal .btn:hover{background:#aecbfa}
.modal .btn:active{transform:scale(.98)}
.modal .btn:disabled{background:var(--surface-3); color:var(--text-muted); cursor:not-allowed}
.modal .err{
  color:var(--danger); font-size:13px; margin-top:12px;
  padding:10px 14px; background:rgba(242,139,130,.1);
  border:1px solid rgba(242,139,130,.3); border-radius:var(--radius-s);
  display:none;
}
.modal .err.show{display:block}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- Name modal -->
<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <h2>Join the session</h2>
    <p>Enter your name to receive your ticket and start playing.</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="30" autocomplete="off">
    <div class="err" id="modalErr"></div>
    <button class="btn" id="confirmNameBtn">Get my ticket</button>
  </div>
</div>

<!-- Game UI -->
<div id="gameRoot" class="hidden">
  <header class="app-bar">
    <div class="logo">H</div>
    <h1>Housie Live</h1>
    <div class="spacer"></div>
    <div class="user-chip">
      <div class="avatar" id="avatarInitials">?</div>
      <span class="name" id="chipName">—</span>
    </div>
  </header>

  <div class="status-strip">
    <span class="status-dot live" id="statusDot"></span>
    <span id="statusLabel">Connected</span>
  </div>

  <main>
    <!-- Left: rotator + grid -->
    <div>
      <div class="card rotator-card">
        <div class="rotator-label">Last called number</div>
        <div class="rotator-number" id="bigNumber">—</div>
        <div class="rotator-meta">
          <div>Called: <strong id="calledCount">0</strong>/90</div>
          <div>Marked: <strong id="markedCountMeta">0</strong>/15</div>
        </div>
      </div>

      <div class="card grid-card">
        <div class="card-title">Numbers Board <span class="badge">1–90</span></div>
        <div class="grid-90" id="grid90"></div>
      </div>
    </div>

    <!-- Right: ticket + progress -->
    <div class="sidebar">
      <div class="card ticket-card">
        <div class="ticket-header">
          <h3>Your ticket</h3>
          <div class="count"><strong id="markedCount">0</strong> / 15 marked</div>
        </div>
        <div class="ticket-grid" id="ticketGrid"></div>
      </div>

      <div class="card progress-card">
        <div class="progress-row">
          <span>Progress</span>
          <span id="progressLabel">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-row" style="margin-top:12px">
          <span>First 5</span>
          <span id="win5Label">—</span>
        </div>
        <div class="progress-row">
          <span>Full house</span>
          <span id="win15Label">—</span>
        </div>
      </div>

      <div class="status-msg" id="statusMsg">
        <span class="icon">🎯</span>
        <span>Waiting for the first number…</span>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase-config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const sessionId = params.get('session');

if (!sessionId) {
  document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#e8eaed;font-family:Roboto,sans-serif"><h2>Invalid session</h2><p style="color:#9aa0a6;margin-top:12px"><a href="index.html" style="color:#8ab4f8">Return to home</a></p></div>';
}

let playerId = null, playerName = null, myTicket = null;
let myMarked = [], calledNumbers = [], lastCalled = null;
let hasWon5 = false, hasWon15 = false;
let listeners = [];

const $ = id => document.getElementById(id);

// DOM refs
const nameModal = $('nameModal');
const nameInput = $('nameInput');
const confirmNameBtn = $('confirmNameBtn');
const modalErr = $('modalErr');
const gameRoot = $('gameRoot');
const bigNumberEl = $('bigNumber');
const grid90 = $('grid90');
const ticketGrid = $('ticketGrid');
const markedCountEl = $('markedCount');
const markedCountMeta = $('markedCountMeta');
const calledCountEl = $('calledCount');
const progressFill = $('progressFill');
const progressLabel = $('progressLabel');
const win5Label = $('win5Label');
const win15Label = $('win15Label');
const statusMsg = $('statusMsg');
const chipName = $('chipName');
const avatarInitials = $('avatarInitials');

// Build 90 grid
function buildGrid() {
  grid90.innerHTML = '';
  for (let i = 1; i <= 90; i++) {
    const d = document.createElement('div');
    d.className = 'num-cell';
    d.textContent = i;
    d.dataset.num = i;
    grid90.appendChild(d);
  }
}
buildGrid();

// Ticket rendering
function renderTicket() {
  ticketGrid.innerHTML = '';
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 9; c++) {
      const num = myTicket[r][c];
      const cell = document.createElement('div');
      if (num === null) {
        cell.className = 'ticket-cell empty';
      } else {
        cell.className = 'ticket-cell';
        cell.textContent = num;
        if (myMarked.includes(num)) cell.classList.add('marked');
        else if (calledNumbers.includes(num)) cell.classList.add('called-now');
        cell.addEventListener('click', () => handleMark(num));
      }
      ticketGrid.appendChild(cell);
    }
  }
  const pct = Math.round((myMarked.length / 15) * 100);
  markedCountEl.textContent = myMarked.length;
  markedCountMeta.textContent = myMarked.length;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = pct + '%';
  win5Label.textContent = hasWon5 ? '✅ Yes' : (myMarked.length >= 5 ? '✔ Ready' : '—');
  win15Label.textContent = hasWon15 ? '🏆 Yes' : '—';
}

// Mark handling
async function handleMark(num) {
  if (hasWon15) { showStatus('win', '🏆 You already completed a full house!'); return; }
  if (myMarked.includes(num)) { showStatus('info', `${num} is already marked.`); return; }
  if (!calledNumbers.includes(num)) {
