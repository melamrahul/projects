<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0720">
<title>Housie — Host Console</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#58cc02;--greenD:#46a302;--yellow:#ffc800;--yellowD:#d9a400;--red:#ff4b4b;--redD:#d93a3a;--blue:#1cb0f6;--blueD:#1593cf;--ink:#3c3c3c;--mute:#8a8a8a;--line:#e5e5e5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:800;color:var(--ink);min-height:100vh;background:radial-gradient(circle at 12% 8%,#ffffff22 0 70px,transparent 71px),radial-gradient(circle at 92% 40%,#ffffff1a 0 100px,transparent 101px),linear-gradient(#3aa8ff,#1c6fe0) fixed}
h1,h2,.btn,.ball,.st b{font-family:'Baloo 2',sans-serif}
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#1c6fe0e6;position:sticky;top:0;z-index:10;backdrop-filter:blur(6px);color:#fff}
.top svg{width:40px;height:40px}.top h1{font-size:22px;flex:1}.top a{color:#fff;text-decoration:none;font-size:14px;background:#fff3;padding:7px 14px;border-radius:12px}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:18px}
.card h2{font-size:19px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.full{grid-column:1/-1}
.btn{--c:var(--green);--d:var(--greenD);font-weight:800;font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:#fff;border:none;border-radius:14px;padding:11px 18px;cursor:pointer;background:var(--c);box-shadow:0 4px 0 var(--d);text-decoration:none;display:inline-block;transition:transform .07s,box-shadow .07s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--d)}
.btn:disabled{--c:#e5e5e5;--d:#cfcfcf;color:#afafaf;cursor:not-allowed}
.btn.gold{--c:var(--yellow);--d:var(--yellowD);color:#6b4b00}.btn.red{--c:var(--red);--d:var(--redD)}.btn.blue{--c:var(--blue);--d:var(--blueD)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:11px 14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:#f7f7f7;color:var(--ink);outline:none;flex:1;min-width:0}
input:focus{border-color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.st{background:#f7f7f7;border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}.st b{display:block;font-size:26px}.st span{font-size:12px;color:var(--mute)}
.share{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{border:2px solid var(--line);border-radius:12px;padding:6px;width:110px;height:110px}.qr img{width:100%;height:100%}
.ball{width:150px;height:150px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;font-size:78px;font-weight:800;color:#6b4b00;background:radial-gradient(circle at 32% 26%,#fff9d6,var(--yellow) 55%,#f0a800);border:6px solid #fff;box-shadow:0 7px 0 var(--yellowD),0 0 0 3px #ffc80055}
.ball.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.3) rotate(-180deg);opacity:0}}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;justify-content:center}.strip span{width:36px;height:36px;border-radius:50%;background:#f7f7f7;border:2px solid var(--line);display:grid;place-items:center;font-family:'Baloo 2';font-size:16px}
.win{background:#f7f7f7;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between}.win.got{background:#d7ffb8;border-color:var(--green);color:var(--greenD)}
.pl{display:flex;justify-content:space-between;padding:9px 12px;border-radius:12px;background:#f7f7f7;margin-bottom:6px;font-size:15px}
.pl small{color:var(--mute);font-size:14px}.list{max-height:300px;overflow:auto}
.feed{max-height:180px;overflow:auto;font-size:14px;color:var(--mute)}.feed div{padding:4px 0}
.dim{color:var(--mute);font-size:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173a73;color:#fff;padding:10px 20px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50}.toast.show{opacity:1}
</style></head><body>
<header class="top"><svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="24" fill="#fff"/><ellipse cx="35" cy="44" rx="9" ry="12" fill="#2b2b2b"/><ellipse cx="65" cy="44" rx="9" ry="12" fill="#2b2b2b"/><path d="M38 64q12 14 24 0" stroke="#2b2b2b" stroke-width="5" fill="#ff6b81" stroke-linecap="round"/></svg><h1>Host Console</h1><a href="index.html" target="_blank">🏠 Player view</a></header>
<main>
  <div class="card full" id="shareCard" style="display:none"><h2>🔗 Invite players</h2>
    <div class="share"><div class="qr" id="qr"></div>
      <div style="flex:1;min-width:220px"><div class="row"><input id="link" readonly><button class="btn blue" id="copy">Copy</button></div>
      <div class="row" style="margin-top:10px"><a class="btn gold" id="wa" target="_blank" style="text-decoration:none">💬 WhatsApp</a><button class="btn" id="nat" style="display:none">📤 Share</button></div></div></div></div>

  <div class="card full"><div class="stats">
    <div class="st"><b id="sSt">—</b><span>Status</span></div><div class="st"><b id="sPl">0</b><span>Players</span></div>
    <div class="st"><b id="sCa">0</b><span>Called</span></div><div class="st"><b id="sW">0/2</b><span>Prizes won</span></div></div></div>

  <div class="card"><h2>🎛️ Session</h2>
    <div class="row"><input id="nm" placeholder="Game name (e.g. Friday Night)" maxlength="40"><button class="btn" id="create">＋ Create</button></div>
    <div class="row" style="margin-top:12px"><button class="btn gold" id="start" disabled>▶ Start game</button><button class="btn red" id="stop" disabled>■ End</button></div>
    <p class="dim" id="info" style="margin-top:12px">No session yet.</p></div>

  <div class="card"><h2>🎲 Number caller <span class="dim" id="rem">90 left</span></h2>
    <div class="ball" id="ball">–</div>
    <div class="row"><button class="btn" id="spin" style="flex:2;font-size:20px;padding:16px" disabled>🎲 Call next</button>
      <button class="btn blue" id="auto" disabled style="flex:1">⏵ Auto</button>
      <select id="spd" style="flex:1"><option value="6000">6s</option><option value="9000" selected>9s</option><option value="14000">14s</option></select></div>
    <div class="strip" id="strip"></div></div>

  <div class="card"><h2>🏆 Prizes</h2><div id="prizes"></div><h2 style="margin-top:14px">📣 Live feed</h2><div class="feed" id="feed"></div></div>
  <div class="card"><h2>👥 Players <span class="dim" id="plN">0</span></h2><div class="list" id="plist"><p class="dim">No players yet.</p></div></div>
</main><div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
firebase.initializeApp({apiKey:'0AzyPiDT3wSi6WAuNX7YzbyJcvUgV0nyoxMwahn0',authDomain:'uesi-ap-default-rtdb.firebaseio.com',databaseURL:'https://uesi-ap-default-rtdb.firebaseio.com',projectId:'uesi-ap'});
const db=firebase.database(),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let sid=null,offs=[],S=null,timer=null,url='';
const toast=t=>{const e=$('toast');e.textContent=t;e.className='toast show';setTimeout(()=>e.className='toast',2200)};
const link=id=>location.origin+location.pathname.replace(/[^/]*$/,'')+'index.html?session='+encodeURIComponent(id);

db.ref('housie/activeSessionId').on('value',s=>{sid=s.val();offs.forEach(f=>f());offs=[];stopAuto();if(!sid){S=null;$('shareCard').style.display='none';render();return}
 const r=db.ref('housie/sessions/'+sid),f=r.on('value',x=>{S=x.val();render()});offs.push(()=>r.off('value',f));
 const e=r.child('events').orderByChild('at').startAt(Date.now()-1000),g=e.on('child_added',x=>{const v=x.val();if(v.type==='react')return;
  const d=document.createElement('div');d.textContent=v.type==='win'?`🏆 ${v.name} won ${v.what}`:`😬 ${v.name} false claim (${v.what})`;$('feed').prepend(d)});offs.push(()=>e.off('child_added',g))});

function render(){const s=S||{},called=Object.keys(s.calledNumbers||{}).map(Number),pls=Object.entries(s.players||{}),cl=s.claims||{};
 const act=s.status==='active';
 $('sSt').textContent=!S?'—':act?'🟢 Live':s.status==='waiting'?'⏳ Lobby':'⛔ Ended';$('sPl').textContent=pls.length;$('sCa').textContent=called.length;$('sW').textContent=(cl.first5?1:0)+(cl.full?1:0)+'/2';
 $('start').disabled=s.status!=='waiting';$('stop').disabled=!act;$('spin').disabled=!act||called.length>=90;$('auto').disabled=!act;
 $('info').innerHTML=S?`<b style="color:#fff">${esc(s.name||'')}</b> · ${s.status}`:'Create a session to begin.';
 $('rem').textContent=(90-called.length)+' left';
 const sorted=Object.entries(s.calledNumbers||{}).sort((a,b)=>(a[1]===true?0:a[1])-(b[1]===true?0:b[1])).map(x=>+x[0]);
 const last=s.lastCalled;if(last&&$('ball').textContent!=last){$('ball').textContent=last;$('ball').classList.remove('pop');void $('ball').offsetWidth;$('ball').classList.add('pop')}if(!last)$('ball').textContent='–';
 $('strip').innerHTML=sorted.slice(-14,-1).reverse().map(n=>`<span>${n}</span>`).join('');
 $('prizes').innerHTML=[['first5','🙋 Jeldhi 5'],['full','🏆 Full House']].map(([k,l])=>`<div class="win ${cl[k]?'got':''}"><span>${l}</span><b>${cl[k]?esc(cl[k].name):'— open —'}</b></div>`).join('');
 $('plN').textContent=pls.length;
 $('plist').innerHTML=pls.length?pls.map(([,p])=>p).sort((a,b)=>(b.marked||[]).length-(a.marked||[]).length).map(p=>`<div class="pl"><span>${esc(p.name)}</span><small>${(p.marked||[]).length}/15 ${p.won15?'🏆':p.won5?'🙋':''}</small></div>`).join(''):'<p class="dim">No players yet.</p>';
 if(sid){url=link(sid);$('shareCard').style.display='block';$('link').value=url;$('wa').href='https://wa.me/?text='+encodeURIComponent('🎲 Join my Housie game: '+url);
  if(!$('qr').dataset.u||$('qr').dataset.u!==url){$('qr').dataset.u=url;$('qr').innerHTML=`<img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}">`}}
 if(cl.full)stopAuto();if(!act)stopAuto()}

$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(url)}catch(e){$('link').select();document.execCommand('copy')}toast('Link copied!')};
if(navigator.share){$('nat').style.display='inline-block';$('nat').onclick=()=>navigator.share({title:'Housie',text:'🎲 Join my Housie game',url}).catch(()=>{})}
$('create').onclick=async()=>{const n=$('nm').value.trim();if(!n)return toast('Enter a game name');const id='s_'+Date.now();
 await db.ref('housie/sessions/'+id).set({name:n,status:'waiting',createdAt:Date.now(),calledNumbers:{},players:{}});await db.ref('housie/activeSessionId').set(id);$('nm').value='';$('feed').innerHTML='';toast('Session created')};
$('start').onclick=()=>db.ref('housie/sessions/'+sid).update({status:'active',startedAt:Date.now()}).then(()=>toast('Game started — players can join'));
$('stop').onclick=()=>{if(confirm('End this game for everyone?'))db.ref('housie/sessions/'+sid).update({status:'stopped',stoppedAt:Date.now()})};
async function spin(){if(!sid||!S||S.status!=='active')return;const called=Object.keys(S.calledNumbers||{}).map(Number);if(called.length>=90)return stopAuto();
 const left=[];for(let i=1;i<=90;i++)if(!called.includes(i))left.push(i);const n=left[Math.random()*left.length|0];
 await db.ref('housie/sessions/'+sid+'/calledNumbers/'+n).set(Date.now());await db.ref('housie/sessions/'+sid+'/lastCalled').set(n)}
$('spin').onclick=spin;
function stopAuto(){if(timer){clearInterval(timer);timer=null}$('auto').textContent='⏵ Auto'}
$('auto').onclick=()=>{if(timer)return stopAuto();spin();timer=setInterval(spin,+$('spd').value);$('auto').textContent='⏸ Pause'};
$('spd').onchange=()=>{if(timer){clearInterval(timer);timer=setInterval(spin,+$('spd').value)}};
render();
</script></body></html>
