<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jeldhi 5 - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0b1a35; --bg-light: #1a3b73;
  --gold: #ffd700; --gold-shadow: #b8860b;
  --green: #00e676; --green-shadow: #009624;
  --blue: #29b6f6; --blue-shadow: #0277bd;
  --red: #ff5252; --red-shadow: #c62828;
  --text-light: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
body { background: linear-gradient(135deg, var(--bg-dark), var(--bg-light)); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, .font-head { font-family: 'Fredoka One', cursive; letter-spacing: 1px; }

.btn-3d {
  display: flex; justify-content: center; align-items: center;
  padding: 16px 24px; border: none; border-radius: 20px;
  font-size: 18px; font-weight: 800; color: white; text-transform: uppercase; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s; width: 100%; margin-bottom: 12px; outline: none;
}
.btn-3d:active { transform: translateY(6px); box-shadow: none !important; }
.btn-green { background: var(--green); box-shadow: 0 6px 0 var(--green-shadow), 0 10px 20px rgba(0,0,0,0.3); text-shadow: 0 2px 0 var(--green-shadow); }
.btn-blue { background: var(--blue); box-shadow: 0 6px 0 var(--blue-shadow), 0 10px 20px rgba(0,0,0,0.3); text-shadow: 0 2px 0 var(--blue-shadow); }
.btn-red { background: var(--red); box-shadow: 0 6px 0 var(--red-shadow), 0 10px 20px rgba(0,0,0,0.3); text-shadow: 0 2px 0 var(--red-shadow); }
.btn-disabled { background: #555; box-shadow: 0 6px 0 #222; cursor: not-allowed; opacity: 0.7; }

.header { padding: 20px; text-align: center; border-bottom: 3px solid var(--gold); background: rgba(0,0,0,0.3); }
.logo-text { font-size: 32px; color: white; text-shadow: 0 4px 0 #111; }
.logo-text span { color: var(--gold); }
.container { max-width: 600px; margin: 0 auto; padding: 20px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 20px; }

.lk-card { background: rgba(255,255,255,0.1); border: 3px solid var(--gold); border-radius: 24px; padding: 20px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.input-field { width: 100%; padding: 16px; border-radius: 16px; border: 3px solid #ccc; background: #fff; color: #333; font-size: 16px; font-weight: 700; outline: none; margin-bottom: 16px; text-align: center; }

.rotator-number {
  width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 20px;
  background: radial-gradient(circle at 30% 30%, #333, #000); border: 6px solid var(--gold);
  display: flex; justify-content: center; align-items: center;
  font-family: 'Fredoka One', cursive; font-size: 72px; color: var(--gold);
  box-shadow: 0 0 40px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255, 215, 0, 0.2);
}
.rotator-number.spin { animation: pop 0.4s ease; }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }

.avatar-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px; }
.avatar-item { display: flex; flex-direction: column; align-items: center; width: 70px; }
.avatar-circle { width: 60px; height: 60px; border-radius: 50%; background: #444; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.4); margin-bottom: 6px; }
.avatar-name { font-size: 12px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.avatar-host { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }

.room-code-box { background: #111; border: 3px dashed var(--gold); border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 20px; }
.room-code { font-size: 40px; font-family: 'Fredoka One'; color: var(--gold); letter-spacing: 8px; }
.copy-btn { background: var(--blue); color: white; padding: 8px 16px; border-radius: 8px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }

.winner-list { margin-top: 20px; }
.winner-item { background: rgba(255,215,0,0.2); border: 2px solid var(--gold); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; font-weight: bold; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <h1 class="logo-text">Jeldhi <span>5</span> Admin</h1>
</div>

<div class="container">
  
  <!-- Create / Lobby View -->
  <div id="view-lobby">
    <div class="lk-card" id="create-room-box">
      <h2 style="text-align:center; color:var(--gold); margin-bottom:16px;">Start a Game</h2>
      <input type="text" id="adminNameInput" class="input-field" placeholder="Your Host Name" maxlength="15">
      <button class="btn-3d btn-green" onclick="createRoom()">🎲 CREATE ROOM</button>
    </div>

    <div class="lk-card hidden" id="room-waiting-box">
      <div class="room-code-box">
        <div style="font-size:12px; color:#aaa; letter-spacing:2px;">ROOM CODE</div>
        <div class="room-code" id="displayCode">------</div>
        <button class="copy-btn" onclick="copyLink()">📋 Copy Invite Link</button>
      </div>
      
      <h3 style="text-align:center; margin-bottom:10px;">Players Joined (<span id="playerCount">1</span>)</h3>
      <div class="avatar-grid" id="lobbyPlayers"></div>
      
      <button class="btn-3d btn-blue" style="margin-top:20px;" onclick="startGame()">▶ START GAME</button>
    </div>
  </div>

  <!-- Game View -->
  <div id="view-game" class="hidden">
    <div class="lk-card" style="text-align:center;">
      <h3 style="color:var(--gold); margin-bottom:10px;">LAST CALLED</h3>
      <div class="rotator-number" id="bigNumber">--</div>
      
      <button class="btn-3d btn-green" id="spinBtn" onclick="callNumber()" style="font-size:24px; padding:20px;">🎲 CALL NUMBER</button>
      <button class="btn-3d btn-red" onclick="stopGame()" style="padding:10px; font-size:14px;">⛔ END SESSION</button>
      
      <div style="margin-top:10px; font-size:14px; color:#aaa;">Called: <strong id="calledCount">0</strong> / 90</div>
    </div>

    <div class="lk-card">
      <h3 style="color:var(--gold); margin-bottom:10px;">Winners</h3>
      <div class="winner-list" id="winnersList">
        <div style="font-size:14px; color:#aaa; text-align:center;">No winners yet...</div>
      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
    apiKey: '0AzyPiDT3wSi6WAuNX7YzbyJcvUgV0nyoxMwahn0',
    authDomain: 'uesi-ap-default-rtdb.firebaseio.com',
    databaseURL: 'https://uesi-ap-default-rtdb.firebaseio.com',
    projectId: 'uesi-ap'
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentRoomCode = null;
let roomRef = null;
let gameStatus = "waiting";
let myId = 'host_' + Math.random().toString(36).substr(2, 5);

// Audio
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();
function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'call') { osc.type='triangle'; osc.frequency.setValueAtTime(500, audioCtx.currentTime); osc.frequency.setValueAtTime(700, audioCtx.currentTime+0.1); osc.frequency.setValueAtTime(900, audioCtx.currentTime+0.2); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.4); osc.start(); osc.stop(audioCtx.currentTime+0.4); }
}
function speakNumber(num) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(`Number ${num}`);
    msg.rate = 0.9; msg.pitch = 1.1;
    window.speechSynthesis.speak(msg);
}

function generateCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for(let i=0; i<6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
}

async function createRoom() {
    const name = document.getElementById('adminNameInput').value.trim();
    if (!name) return alert("Enter your name first!");

    currentRoomCode = generateCode();
    roomRef = db.ref('housie/rooms/' + currentRoomCode);
    
    await roomRef.set({
        host: myId,
        status: 'waiting',
        createdAt: Date.now(),
        calledNumbers: {},
        lastCalled: null,
        players: {
            [myId]: { name: name, isHost: true, marked: [] }
        }
    });

    document.getElementById('create-room-box').classList.add('hidden');
    document.getElementById('room-waiting-box').classList.remove('hidden');
    document.getElementById('displayCode').textContent = currentRoomCode;
    
    attachListeners();
}

function copyLink() {
    const url = window.location.origin + window.location.pathname.replace('admin.html', 'index.html') + '?room=' + currentRoomCode;
    navigator.clipboard.writeText(url).then(() => alert("Link copied: " + url));
}

async function startGame() {
    if (!roomRef) return;
    await roomRef.child('status').set('active');
}

async function callNumber() {
    if (gameStatus !== 'active') return;
    playSound('call');
    
    const snap = await roomRef.once('value');
    const room = snap.val();
    const called = room.calledNumbers || {};
    
    if (Object.keys(called).length >= 90) return alert("All 90 called!");
    
    let num;
    do { num = Math.floor(Math.random() * 90) + 1; } while (called[num]);
    
    await roomRef.child('calledNumbers/' + num).set(true);
    await roomRef.child('lastCalled').set(num);
    speakNumber(num);
}

async function stopGame() {
    if(!confirm("End game for everyone?")) return;
    await roomRef.child('status').set('ended');
}

function attachListeners() {
    roomRef.on('value', snap => {
        const room = snap.val();
        if (!room) return;
        gameStatus = room.status;
        
        const players = room.players || {};
        const called = room.calledNumbers ? Object.keys(room.calledNumbers) : [];
        
        if (gameStatus === 'waiting') {
            document.getElementById('playerCount').textContent = Object.keys(players).length;
            const grid = document.getElementById('lobbyPlayers');
            grid.innerHTML = '';
            Object.keys(players).forEach(uid => {
                const p = players[uid];
                grid.innerHTML += `
                    <div class="avatar-item">
                        <div class="avatar-circle ${p.isHost ? 'avatar-host' : ''}">
                            ${p.name.charAt(0).toUpperCase()}
                        </div>
                        <div class="avatar-name">${p.name}</div>
                    </div>
                `;
            });
        } 
        else if (gameStatus === 'active' || gameStatus === 'ended') {
            document.getElementById('view-lobby').classList.add('hidden');
            document.getElementById('view-game').classList.remove('hidden');
            
            document.getElementById('calledCount').textContent = called.length;
            
            if (room.lastCalled) {
                const el = document.getElementById('bigNumber');
                if (el.textContent !== String(room.lastCalled)) {
                    el.textContent = room.lastCalled;
                    el.classList.remove('spin'); void el.offsetWidth; el.classList.add('spin');
                }
            }
            
            // Winners list
            const winnersBox = document.getElementById('winnersList');
            let html = '';
            
            if (room.claims) {
                if (room.claims.jeldhi5) {
                    html += `<div class="winner-item"><span>🏆 Jeldhi 5</span> <span>${room.claims.jeldhi5.name}</span></div>`;
                }
                if (room.claims.fullhouse) {
                    html += `<div class="winner-item" style="background:#00e676; color:#111;"><span>👑 Full House</span> <span>${room.claims.fullhouse.name}</span></div>`;
                }
            }
            if (!html) html = '<div style="font-size:14px; color:#aaa; text-align:center;">No winners yet...</div>';
            winnersBox.innerHTML = html;
            
            if (gameStatus === 'ended') {
                const btn = document.getElementById('spinBtn');
                btn.classList.add('btn-disabled');
                btn.disabled = true;
            }
        }
    });
}
</script>
</body>
</html>
