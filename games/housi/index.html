<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jeldhi 5 - Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg-dark: #0b1a35; --bg-light: #1a3b73; --gold: #ffd700; --gold-shadow: #b8860b; --green: #00e676; --green-shadow: #009624; --blue: #29b6f6; --blue-shadow: #0277bd; --red: #ff5252; --red-shadow: #c62828; --purple: #ab47bc; --purple-shadow: #6a1b9a; --text-light: #ffffff; --cell-bg: #fff8e1; --cell-text: #333; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: linear-gradient(135deg, var(--bg-dark), var(--bg-light)); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
h1, h2, h3, .font-head { font-family: 'Fredoka One', cursive; font-weight: normal; letter-spacing: 1px; }

.btn-3d { display: flex; justify-content: center; align-items: center; padding: 16px 24px; border: none; border-radius: 20px; font-size: 18px; font-weight: 800; color: white; text-transform: uppercase; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; width: 100%; margin-bottom: 16px; outline: none; }
.btn-3d:active { transform: translateY(6px); box-shadow: none !important; }
.btn-green { background: var(--green); box-shadow: 0 6px 0 var(--green-shadow), 0 10px 20px rgba(0,0,0,0.3); text-shadow: 0 2px 0 var(--green-shadow); }
.btn-blue { background: var(--blue); box-shadow: 0 6px 0 var(--blue-shadow), 0 10px 20px rgba(0,0,0,0.3); text-shadow: 0 2px 0 var(--blue-shadow); }
.btn-red { background: var(--red); box-shadow: 0 6px 0 var(--red-shadow), 0 10px 20px rgba(0,0,0,0.3); text-shadow: 0 2px 0 var(--red-shadow); }
.btn-gold { background: var(--gold); color: #333; box-shadow: 0 6px 0 var(--gold-shadow), 0 10px 20px rgba(0,0,0,0.3); text-shadow: 0 2px 0 rgba(255,255,255,0.5); }
.btn-purple { background: var(--purple); box-shadow: 0 6px 0 var(--purple-shadow), 0 10px 20px rgba(0,0,0,0.3); text-shadow: 0 2px 0 var(--purple-shadow); }

.input-field { width: 100%; padding: 16px 20px; border-radius: 16px; border: 3px solid var(--gold); background: #fff; color: #333; font-size: 18px; font-weight: 700; outline: none; margin-bottom: 16px; text-align: center; }
.screen { display: none; flex-direction: column; min-height: 100vh; padding: 20px; animation: fadeIn 0.3s ease; }
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

.logo-container { text-align: center; margin: 40px 0 20px; }
.logo-icon { width: 100px; height: 100px; margin: 0 auto 16px; background: conic-gradient(from 45deg, var(--red) 0deg 90deg, var(--green) 90deg 180deg, var(--gold) 180deg 270deg, var(--blue) 270deg 360deg); border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; border: 6px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.4); animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.logo-text { font-size: 48px; color: white; text-shadow: 0 4px 0 #111, 0 8px 15px rgba(0,0,0,0.5); }
.logo-text span { color: var(--gold); }
.tagline { font-size: 16px; color: #ccc; font-weight: 600; margin-bottom: 30px; }

.lk-card { background: rgba(255,255,255,0.1); border: 3px solid var(--gold); border-radius: 24px; padding: 24px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }

.game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.room-badge { background: #111; padding: 8px 16px; border-radius: 100px; font-weight: 800; color: var(--gold); border: 2px solid var(--gold); }

.ticket-wrap { background: #1a3b73; border: 4px solid var(--gold); border-radius: 20px; padding: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); margin-bottom: 20px; }
.ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
.t-cell { aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; background: var(--cell-bg); border-radius: 12px; font-size: clamp(20px, 5vw, 28px); font-weight: 800; color: var(--cell-text); cursor: pointer; transition: transform 0.1s, background 0.2s; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1); user-select: none; }
.t-cell.empty { background: transparent; box-shadow: none; cursor: default; }
.t-cell.marked { background: var(--gold); color: #111; animation: pop 0.3s ease; box-shadow: inset 0 -4px 0 var(--gold-shadow); }
.t-cell.called-unmarked { background: #e3f2fd; border: 3px solid var(--blue); color: var(--blue); animation: pulse-border 1.5s infinite; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes pulse-border { 0%, 100% { border-color: var(--blue); } 50% { border-color: #fff; } }

.rotator-box { text-align: center; margin-bottom: 20px; }
.rotator-number { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto; background: radial-gradient(circle at 30% 30%, #333, #000); border: 4px solid var(--gold); display: flex; justify-content: center; align-items: center; font-family: 'Fredoka One', cursive; font-size: 64px; color: var(--gold); box-shadow: 0 0 30px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255, 215, 0, 0.2); }
.rotator-number.spin { animation: spinPop 0.5s ease; }
@keyframes spinPop { 0% { transform: scale(0.5) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

.called-strip { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 20px; }
.c-chip { background: #333; color: #888; width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; }
.c-chip.called { background: var(--blue); color: white; }
.c-chip.last { background: var(--gold); color: #111; transform: scale(1.2); box-shadow: 0 0 10px var(--gold); z-index: 2; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-box { background: linear-gradient(180deg, #1e3c72, #2a5298); border: 4px solid var(--gold); border-radius: 30px; padding: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8); transform: translateY(20px); transition: transform 0.3s; }
.modal-overlay.active .modal-box { transform: translateY(0); }
.modal-icon { font-size: 60px; margin-bottom: 10px; }
.modal-title { font-size: 28px; color: var(--gold); margin-bottom: 10px; }
.modal-text { font-size: 16px; margin-bottom: 20px; line-height: 1.4; }

.confetti { position: fixed; width: 10px; height: 10px; background-color: #f00; animation: fall linear forwards; z-index: 1000; pointer-events: none; }
@keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
.hidden { display: none !important; }

.avatar-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px; }
.avatar-item { display: flex; flex-direction: column; align-items: center; width: 70px; }
.avatar-circle { width: 60px; height: 60px; border-radius: 50%; background: #444; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: white; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.4); margin-bottom: 6px; }
.avatar-name { font-size: 12px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.avatar-host { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }
</style>
</head>
<body>

<!-- SCREEN 1: ENTER CODE (Only shown if no URL param) -->
<div id="screen-code" class="screen">
  <div class="logo-container">
    <div class="logo-icon"></div>
    <h1 class="logo-text">Jeldhi <span>5</span></h1>
    <p class="tagline">Enter Room Code to Join</p>
  </div>
  <div class="lk-card">
    <input type="text" id="codeInput" class="input-field" placeholder="ABCDEF" maxlength="6" style="text-transform: uppercase; font-size: 32px; letter-spacing: 8px;">
    <button class="btn-3d btn-green" onclick="submitCode()">NEXT</button>
  </div>
</div>

<!-- SCREEN 2: ENTER NAME -->
<div id="screen-name" class="screen">
  <div class="logo-container" style="margin-top: 20px;">
    <h1 class="logo-text">WHO ARE YOU?</h1>
    <p class="tagline" id="joiningRoomText">Joining Room: -----</p>
  </div>
  <div class="lk-card">
    <input type="text" id="nameInput" class="input-field" placeholder="Your Name" maxlength="15">
    <button class="btn-3d btn-green" onclick="submitName()">JOIN GAME</button>
    <button class="btn-3d btn-red" onclick="leaveRoom()" style="margin-top: 10px; padding: 10px;">Cancel</button>
  </div>
</div>

<!-- SCREEN 3: LOBBY -->
<div id="screen-lobby" class="screen">
  <div class="game-header">
    <div class="room-badge">ROOM: <span id="lobbyCode">------</span></div>
    <button class="btn-3d btn-red" style="width: auto; padding: 8px 16px; margin: 0; font-size: 14px;" onclick="leaveRoom()">Leave</button>
  </div>
  <div class="lk-card" style="flex: 1;">
    <h2 class="text-center" style="color: var(--gold); margin-bottom: 20px;">PLAYERS IN ROOM</h2>
    <div class="avatar-grid" id="lobbyPlayers"></div>
  </div>
  <div id="playerControls" class="text-center" style="padding: 20px;">
    <h3 style="color: #ccc;">Waiting for Host to start...</h3>
    <div class="rotator-number spin" style="width: 60px; height: 60px; font-size: 30px; margin-top: 20px;">⏳</div>
  </div>
</div>

<!-- SCREEN 4: GAME -->
<div id="screen-game" class="screen" style="padding: 10px;">
  <div class="game-header">
    <div class="room-badge" style="font-size: 12px; padding: 4px 10px;">ROOM: <span id="gameCode">------</span></div>
    <div style="font-weight: 800; color: var(--gold);">Marked: <span id="markedCount">0</span>/15</div>
    <button class="btn-3d btn-red" style="width: auto; padding: 6px 12px; margin: 0; font-size: 12px;" onclick="leaveRoom()">Exit</button>
  </div>

  <div class="rotator-box">
    <div class="rotator-number" id="bigNumber">--</div>
    <div style="font-size: 12px; font-weight: 700; color: #aaa; margin-top: 8px;">CALLED: <span id="calledCount">0</span>/90</div>
  </div>

  <div class="ticket-wrap">
    <div class="ticket-grid" id="ticketGrid"></div>
  </div>

  <div class="admin-panel" id="playerActionArea" style="flex-direction: column; gap: 10px;">
    <button class="btn-3d btn-gold" id="claim5Btn" onclick="claimJeldhi5()" style="margin: 0; opacity: 0.5;">🏆 CLAIM JELDHI 5</button>
    <button class="btn-3d btn-purple" id="claim15Btn" onclick="claimFullHouse()" style="margin: 0; opacity: 0.5;">👑 CLAIM FULL HOUSE</button>
  </div>

  <div class="called-strip" id="calledStrip" style="margin-top: 10px; max-height: 60px; overflow: hidden;"></div>
</div>

<!-- MODALS -->
<div id="modal-claim" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-icon">😱</div>
    <h2 class="modal-title" id="claimTitle">CLAIM?</h2>
    <p class="modal-text" id="claimText">Are you sure? Everyone will see if you are wrong!</p>
    <button class="btn-3d btn-green" id="confirmClaimBtn">YES, I AM SURE</button>
    <button class="btn-3d btn-red" onclick="closeModal('modal-claim')">CANCEL</button>
  </div>
</div>

<div id="modal-info" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-icon" id="infoIcon">🎉</div>
    <h2 class="modal-title" id="infoTitle">WINNER!</h2>
    <p class="modal-text" id="infoText">Rahul got Jeldhi 5</p>
    <button class="btn-3d btn-green" onclick="closeModal('modal-info')">CONTINUE</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = { apiKey: '0AzyPiDT3wSi6WAuNX7YzbyJcvUgV0nyoxMwahn0', authDomain: 'uesi-ap-default-rtdb.firebaseio.com', databaseURL: 'https://uesi-ap-default-rtdb.firebaseio.com', projectId: 'uesi-ap' };
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myId = localStorage.getItem('housie_uid') || 'u_' + Math.random().toString(36).substr(2, 9);
localStorage.setItem('housie_uid', myId);

let currentRoomCode = null;
let playerName = null, myTicket = null;
let myMarked = [], calledNumbers = [];
let gameStatus = "waiting";
let roomRef = null;
let currentClaimType = "";
let expiryInterval = null;
let roomExpiresAt = 0;

// Audio & TTS
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();
function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'tap') { osc.type='sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
    else if (type === 'mark') { osc.type='square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime+0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
    else if (type === 'call') { osc.type='triangle'; osc.frequency.setValueAtTime(500, audioCtx.currentTime); osc.frequency.setValueAtTime(700, audioCtx.currentTime+0.1); osc.frequency.setValueAtTime(900, audioCtx.currentTime+0.2); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.4); osc.start(); osc.stop(audioCtx.currentTime+0.4); }
    else if (type === 'win') { osc.type='sine'; [400,500,600,800].forEach((f,i)=>osc.frequency.setValueAtTime(f, audioCtx.currentTime+i*0.1)); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.5); osc.start(); osc.stop(audioCtx.currentTime+0.5); }
    else if (type === 'fail') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime+0.3); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.3); osc.start(); osc.stop(audioCtx.currentTime+0.3); }
}
function speakNumber(num) { if (!('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); const msg = new SpeechSynthesisUtterance(`Number ${num}`); msg.rate = 0.9; msg.pitch = 1.1; window.speechSynthesis.speak(msg); }

function generateTicket() {
    const colRanges = [[1,9],[10,19],[20,29],[30,39],[40,49],[50,59],[60,69],[70,79],[80,90]];
    let grid = null, attempts = 0;
    while (attempts < 500 && !grid) {
        attempts++;
        const g = Array(3).fill().map(() => Array(9).fill(null));
        for (let r = 0; r < 3; r++) {
            const cols = [0,1,2,3,4,5,6,7,8].sort(() => Math.random() - 0.5).slice(0, 5);
            cols.forEach(c => g[r][c] = 'fill');
        }
        let ok = true;
        for (let c = 0; c < 9; c++) if (!g[0][c] && !g[1][c] && !g[2][c]) { ok = false; break; }
        if (ok) grid = g;
    }
    if (!grid) return generateTicket();
    for (let c = 0; c < 9; c++) {
        const [min, max] = colRanges[c];
        const avail = [];
        for (let n = min; n <= max; n++) avail.push(n);
        avail.sort(() => Math.random() - 0.5);
        const rows = [0,1,2].filter(r => grid[r][c] === 'fill');
        rows.forEach((r, i) => grid[r][c] = avail[i]);
    }
    return grid;
}

function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + screenId).classList.add('active');
}
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function showModal(id) { document.getElementById(id).classList.add('active'); }

// PLUG AND PLAY ROUTING
window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const urlRoom = urlParams.get('Id');
    const savedRoom = localStorage.getItem('housie_current_room');
    
    if (urlRoom) {
        currentRoomCode = urlRoom.toUpperCase();
        document.getElementById('joiningRoomText').textContent = "Joining Room: " + currentRoomCode;
        if (savedRoom === currentRoomCode) {
            playerName = localStorage.getItem('housie_player_name');
            if (playerName) { rejoinGame(); return; }
        }
        switchScreen('name');
    } else if (savedRoom) {
        currentRoomCode = savedRoom;
        playerName = localStorage.getItem('housie_player_name');
        if(playerName) { rejoinGame(); } 
        else { switchScreen('code'); }
    } else {
        switchScreen('code');
    }
};

function submitCode() {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (code.length !== 6) return alert("Enter 6 characters");
    currentRoomCode = code;
    document.getElementById('joiningRoomText').textContent = "Joining Room: " + currentRoomCode;
    switchScreen('name');
}

function submitName() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return alert("Enter your name");
    playerName = name;
    localStorage.setItem('housie_player_name', playerName);
    localStorage.setItem('housie_current_room', currentRoomCode);
    joinGame();
}

async function joinGame() {
    playSound('tap');
    roomRef = db.ref('housie/rooms/' + currentRoomCode);
    
    try {
        const snap = await roomRef.once('value');
        const room = snap.val();
        if (!room) throw new Error("Room not found!");
        if (room.status !== 'waiting') throw new Error("Game already started!");

        if (room.players) {
            Object.values(room.players).forEach(p => {
                if (p.name.toLowerCase() === playerName.toLowerCase()) throw new Error("Name already taken!");
            });
        }

        myTicket = generateTicket();
        await roomRef.child('players/' + myId).set({
            name: playerName, ticket: myTicket, marked: [], isHost: false
        });

        document.getElementById('lobbyCode').textContent = currentRoomCode;
        document.getElementById('gameCode').textContent = currentRoomCode;
        switchScreen('lobby');
        attachRoomListeners();

    } catch (e) {
        alert(e.message);
        localStorage.removeItem('housie_current_room');
        window.location.href = window.location.pathname;
    }
}

async function rejoinGame() {
    roomRef = db.ref('housie/rooms/' + currentRoomCode);
    const snap = await roomRef.once('value');
    const room = snap.val();
    if (room && room.players && room.players[myId]) {
        myTicket = room.players[myId].ticket;
        document.getElementById('lobbyCode').textContent = currentRoomCode;
        document.getElementById('gameCode').textContent = currentRoomCode;
        attachRoomListeners();
    } else {
        localStorage.removeItem('housie_current_room');
        switchScreen('code');
    }
}

function leaveRoom() {
    if (confirm("Leave game?")) {
        if (roomRef) roomRef.child('players/' + myId).remove();
        localStorage.removeItem('housie_current_room');
        window.location.href = window.location.pathname;
    }
}

async function handleCellClick(num) {
    if (gameStatus !== 'active') return;
    if (myMarked.includes(num)) return;
    if (!calledNumbers.includes(num)) { playSound('fail'); alert("Number not called yet!"); return; }
    
    myMarked.push(num);
    renderTicket();
    playSound('mark');
    await roomRef.child(`players/${myId}/marked`).set(myMarked);
    updateClaimButtons();
}

function updateClaimButtons() {
    document.getElementById('claim5Btn').style.opacity = myMarked.length >= 5 ? '1' : '0.5';
    document.getElementById('claim15Btn').style.opacity = myMarked.length >= 15 ? '1' : '0.5';
}

function claimJeldhi5() {
    if (myMarked.length < 5) return;
    currentClaimType = "jeldhi5";
    document.getElementById('claimTitle').textContent = "CLAIM JELDHI 5?";
    document.getElementById('claimText').textContent = "You have 5 marked. Everyone will see if you are wrong!";
    showModal('modal-claim');
}

function claimFullHouse() {
    if (myMarked.length < 15) return;
    currentClaimType = "fullhouse";
    document.getElementById('claimTitle').textContent = "CLAIM FULL HOUSE?";
    document.getElementById('claimText').textContent = "You have all 15 marked!";
    showModal('modal-claim');
}

document.getElementById('confirmClaimBtn').onclick = () => {
    closeModal('modal-claim');
    roomRef.child('claims/' + currentClaimType).transaction(currentData => {
        if (currentData === null) return { uid: myId, name: playerName, valid: true };
        return;
    }, (error, committed) => {
        if (!committed) { playSound('fail'); showInfoModal("TOO LATE", "Someone claimed first!", "😭"); }
    });
};

function validateClaims(claims, roomPlayers) {
    if (!claims) return;
    if (claims.jeldhi5 && claims.jeldhi5.valid) {
        const c = claims.jeldhi5;
        const p = roomPlayers[c.uid];
        if (!p || (p.marked||[]).length < 5) {
            roomRef.child('claims/jeldhi5/valid').set(false);
            roomRef.child('claims/jeldhi5/invalidMsg').set(`${c.name} only has ${(p?.marked||[]).length} marked!`);
            setTimeout(() => roomRef.child('claims/jeldhi5').remove(), 3000);
        } else if (c.uid !== myId && !document.getElementById('modal-info').classList.contains('active')) {
            showInfoModal("JELDHI 5!", `${c.name} won!`, "🏆"); playSound('win');
        }
    }
    if (claims.fullhouse && claims.fullhouse.valid) {
        const c = claims.fullhouse;
        const p = roomPlayers[c.uid];
        if (!p || (p.marked||[]).length < 15) {
            roomRef.child('claims/fullhouse/valid').set(false);
            roomRef.child('claims/fullhouse/invalidMsg').set(`${c.name} only has ${(p?.marked||[]).length} marked!`);
            setTimeout(() => roomRef.child('claims/fullhouse').remove(), 3000);
        } else {
            roomRef.child('status').set('ended');
            if (!document.getElementById('modal-info').classList.contains('active')) {
                showInfoModal("FULL HOUSE!", `${c.name} WON!`, "👑"); fireConfetti(); playSound('win');
            }
        }
    }
}

function showInfoModal(title, text, icon) {
    document.getElementById('infoTitle').textContent = title;
    document.getElementById('infoText').textContent = text;
    document.getElementById('infoIcon').textContent = icon;
    showModal('modal-info');
}

function attachRoomListeners() {
    roomRef.on('value', snap => {
        const room = snap.val();
        if (!room) { alert("Room deleted."); window.location.href = '/'; return; }
        gameStatus = room.status;
        calledNumbers = room.calledNumbers ? Object.keys(room.calledNumbers).map(Number) : [];
        
        // Auto-delete after 15 mins if active or waiting
        if (room.createdAt) {
            const elapsed = Date.now() - room.createdAt;
            if (elapsed > 15 * 60 * 1000) {
                roomRef.remove();
                localStorage.removeItem('housie_current_room');
                alert("Game session expired (15 min limit).");
                window.location.href = window.location.pathname;
                return;
            }
        }

        if (gameStatus === 'active' && document.getElementById('screen-lobby').classList.contains('active')) switchScreen('game');
        if (gameStatus === 'ended') document.getElementById('confirmClaimBtn').disabled = true;
        
        if (room.players && room.players[myId]) {
            myMarked = room.players[myId].marked || [];
            renderTicket(); updateClaimButtons();
        }

        if (gameStatus === 'waiting') renderLobby(room.players);
        else { renderGame(room); validateClaims(room.claims, room.players); }
    });
}

function renderLobby(players) {
    const grid = document.getElementById('lobbyPlayers'); grid.innerHTML = '';
    if (!players) return;
    Object.keys(players).forEach(uid => {
        const p = players[uid];
        grid.innerHTML += `<div class="avatar-item"><div class="avatar-circle ${p.isHost ? 'avatar-host' : ''}" style="background: hsl(${uid.length * 40}, 70%, 50%)">${p.name.charAt(0).toUpperCase()}</div><div class="avatar-name">${p.name}</div></div>`;
    });
}

function renderGame(room) {
    if (room.lastCalled && document.getElementById('bigNumber').textContent !== String(room.lastCalled)) {
        const el = document.getElementById('bigNumber');
        el.textContent = room.lastCalled;
        el.classList.remove('spin'); void el.offsetWidth; el.classList.add('spin');
        playSound('call'); speakNumber(room.lastCalled);
    }
    document.getElementById('calledCount').textContent = calledNumbers.length;
    document.getElementById('markedCount').textContent = myMarked.length;
    
    const strip = document.getElementById('calledStrip'); strip.innerHTML = '';
    [...calledNumbers].sort((a,b)=>b-a).slice(0,20).forEach(n => {
        strip.innerHTML += `<div class="c-chip ${n === room.lastCalled ? 'last' : 'called'}">${n}</div>`;
    });
    renderTicket();
}

function renderTicket() {
    const grid = document.getElementById('ticketGrid'); grid.innerHTML = '';
    if (!myTicket) return;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 9; c++) {
        const num = myTicket[r][c]; const cell = document.createElement('div');
        if (num === null) cell.className = 't-cell empty';
        else {
            cell.className = 't-cell'; cell.textContent = num;
            if (myMarked.includes(num)) cell.classList.add('marked');
            else if (calledNumbers.includes(num)) cell.classList.add('called-unmarked');
            cell.onclick = () => handleCellClick(num);
        }
        grid.appendChild(cell);
    }
}

function fireConfetti() {
    const colors = ['#ffd700', '#00e676', '#29b6f6', '#ff5252', '#ab47bc'];
    for (let i = 0; i < 50; i++) {
        const conf = document.createElement('div'); conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw'; conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
        document.body.appendChild(conf); setTimeout(() => conf.remove(), 5000);
    }
}
</script>
